# Dedicated styling for menus launched through dmenu_command.
dpi-aware=no
width=44
font=sf mono:bold:size=12
line-height=36
prompt="❯   "
exit-on-keyboard-focus-loss=no

[border]
radius=12
width=1

[colors]
background="#1a1a1aff"
text="#ebdbb2ff"
selection="#005577ff"
selection-text="#ebdbb2ff"
match="#83a598ff"
selection-match="#d3869bff"
border="#005577ff"

[dmenu]
exit-immediately-if-empty=yes
