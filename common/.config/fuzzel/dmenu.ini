# Dedicated styling for menus launched through dmenu_command.
dpi-aware=no
width=60
; font=sf mono:bold:size=18
font=sf mono:bold:size=15
line-height=40
prompt="❯   "
exit-on-keyboard-focus-loss=no

[border]
radius=12
width=2
selection-radius=6

[colors]
background="#285577ff"
text="#ffffffff"
selection="#4c7899ff"
selection-text="#ffffffff"
match="#8ec3e6ff"
selection-match="#e0f0fbff"
border="#4c7899ff"
prompt="#e0a0ffff"

[dmenu]
exit-immediately-if-empty=yes

[key-bindings]
prev=none
next=none
prev-with-wrap=Up
next-with-wrap=Down
