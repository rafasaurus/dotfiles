dpi-aware=no
icon-theme=BluecurveRH
width=50
font=sf mono:bold:size=12
line-height=40
fields=name,generic,comment,categories,filename,keywords
terminal=alacritty -e
prompt="❯   "
show-actions=yes
exit-on-keyboard-focus-loss=no

[border]
radius=12
width=2
selection-radius=6

[colors]
background="#285577ff"
text="#ffffffff"
selection="#4c7899ff"
selection-text="#ffffffff"
match="#8ec3e6ff"
selection-match="#e0f0fbff"
border="#4c7899ff"
prompt="#e0a0ffff"
input="#ffffffff"

[dmenu]
exit-immediately-if-empty=yes

[key-bindings]
prev=none
next=none
prev-with-wrap=Up
next-with-wrap=Down
